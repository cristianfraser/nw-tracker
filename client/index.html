<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NW Tracker</title>
    <meta
      name="description"
      content="An automated net-worth and expense tracker connected to banks, card issuers, brokers and pension funds: every account imported from its own documents and valued daily."
    />
    <!-- Link previews of the hosted demo. Crawlers need absolute URLs, so these name the demo's
         host; og-image.png is rendered by scripts/render-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NW Tracker" />
    <meta property="og:title" content="NW Tracker — every account, valued every day" />
    <meta
      property="og:description"
      content="An automated net-worth and expense tracker connected to its sources: bank, card, broker and pension documents in; one net worth out. Live demo with a fictional person's finances."
    />
    <meta property="og:url" content="https://nw-tracker-demo.onrender.com/" />
    <meta property="og:image" content="https://nw-tracker-demo.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The NW Tracker dashboard: net-worth cards and a daily net-worth chart." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Self-hosted fonts (src/styles/fonts.css). The latin files are preloaded so they
         usually arrive before first paint and the page never swaps fonts; Vite rewrites
         these paths to the same hashed assets the @font-face rules use. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/dm-sans-latin-opsz-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/jetbrains-mono-latin-wght-normal.woff2" />
    <script>
      // Cloudflare Web Analytics — loaded only when a site token was substituted at build
      // time (VITE_CF_ANALYTICS_TOKEN, set on the hosted demo; vite.config defaults it to
      // "" elsewhere), so local dev and the demo rehearsal send nothing. The %-guard covers
      // any context that serves this file without Vite's env substitution.
      // The token is public by design: it names the site, not the account.
      // Counts undercount by design — the beacon host is on common blocklists. The
      // authoritative visit numbers are the server's own (server/src/demoAnalytics.ts, usageLog.ts).
      (function () {
        var token = "%VITE_CF_ANALYTICS_TOKEN%";
        if (!token || token.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.type = "module";
        s.src = "https://static.cloudflareinsights.com/beacon.min.js";
        s.setAttribute("data-cf-beacon", JSON.stringify({ token: token }));
        document.head.appendChild(s);
      })();
    </script>
    <script>
      // The dashboard's first calls start now, while the app's JavaScript downloads, instead of
      // after it runs: the sidebar tree, the page bundle in the stored unit (CLP for a first
      // visit) and — with no chart preference stored — the net-worth chart's default daily series
      // (Diario, 3y = 1096 days), on the routes that open the dashboard (`/`, `/dashboard`). The
      // URLs and credentials match what api.ts then requests, so the browser hands it these.
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        if (path !== "/" && path !== "/dashboard") return;
        var base = "%VITE_API_URL%";
        if (base.charAt(0) === "%") base = "";
        var unit = "clp";
        var chartPrefsStored = false;
        try {
          if (localStorage.getItem("nw-tracker.displayUnit") === "usd") unit = "usd";
          chartPrefsStored = localStorage.getItem("nw-tracker.surface.home.overview") != null;
        } catch (e) {
          // storage blocked: the defaults
        }
        var usd = unit === "usd";
        var urls = [
          base + "/api/meta/sidebar-nav",
          base + "/api/dashboard/page-bundle" + (usd ? "?include_usd=true" : ""),
        ];
        if (!chartPrefsStored) {
          urls.push(base + "/api/dashboard/overview-daily?" + (usd ? "include_usd=true&" : "") + "days=1096");
        }
        for (var i = 0; i < urls.length; i++) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "fetch";
          link.href = urls[i];
          link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
