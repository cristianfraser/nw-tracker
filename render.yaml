# Render blueprint — hosted recruiter demo (synthetic data, open + read-only).
# (The crfrsr.io landing page lives in its own repo — github.com/cristianfraser/crfrsr-site,
# on Cloudflare Pages — so it needs neither a Render service nor a Render custom-domain slot.)
#
# Deploy: Render dashboard → New → Blueprint → connect this repo on the `demo` branch (this
# file is picked up). Releases: `npm run release:demo` fast-forwards `demo` to a commit of `main`.
# No secrets to set. The demo has NO login: recruiters landed on the login page and left
# without trying it, so the gate cost more visits than it bought. DEMO_MODE serves
# /api reads only (server/src/httpSecurity.ts) so an open demo can't be vandalized, and
# anonymous visit/pageview analytics replace the old login log (server/src/demoAnalytics.ts,
# pageviews and endpoint timings in the shared usage log, server/src/usageLog.ts).
# See AGENTS.md "Hosted demo (Render)".
# The repo is safe to make public: tree and full git history are free of personal data
# (balances/amounts/account numbers purged; card last4s scrubbed from all history
# 2026-07-08; per-card config is gitignored; tests use synthetic cards). Author
# name/email appear as intentional attribution (plus the extracted landing page's
# contact link in git history).
#
# Custom domains (Namecheap DNS, see AGENTS.md):
# - nw-tracker.crfrsr.io → nw-tracker-demo — only attaches when the workspace has a free
#   custom-domain slot (Hobby caps at 2/workspace, both used by pokedex). Until then the
#   demo is reached at its .onrender.com URL, which the crfrsr.io homepage
#   (crfrsr-site repo) links to.
# - crfrsr.io / www.crfrsr.io → the crfrsr-site landing page on Cloudflare Pages (not Render).
#
# Notes:
# - PORT is injected by Render; the server reads process.env.PORT.
# - The synthetic DB is generated by buildCommand from current source on every deploy, so the
#   demo always matches the deployed code; boot generates only when it finds the DB empty.
# - startCommand runs the server from source via tsx (same as local dev, minus watch):
#   the compiled dist/ build would not ship server/migrations/*.sql. Build therefore
#   installs devDependencies explicitly (Render sets NODE_ENV=production by default).
# - The demo runs on real market data: the build fetches the history of its holdings (Yahoo),
#   Banco Central series and AFP UNO's valor cuota (its own API) before generating the DB, and its
#   market syncs + live quotes run while someone browses it, sleeping 30 min after the last
#   request (server/src/demoMode.ts, demoData/demoRealMarket.ts, demoMarketActivity.ts).
#   DB backups default off; the dashboard cache warmer stays on for first paint.
# - Single-service same-origin (SERVE_CLIENT_DIST=1) — no CORS_ALLOWED_ORIGINS needed.
# - Every flag below is parsed once at boot by server/src/config.ts (1/true/yes on, 0/false/no off;
#   anything else fails the boot); DEMO_MODE=1 selects the demo deployment profile there.
services:
  - type: web
    name: nw-tracker-demo
    runtime: node
    plan: starter
    # Release branch: only commits released to `demo` (npm run release:demo) deploy here. Pushes to
    # `main` deploy the home server only (scripts/server-deploy.sh). The Blueprint itself is linked
    # to `demo` too, so a render.yaml change also waits for its release.
    branch: demo
    autoDeploy: true
    # Custom domain intentionally NOT declared: the workspace has no free custom-domain
    # slot (Hobby caps at 2, both on pokedex), so the domain add fails and Render rejects
    # the WHOLE blueprint sync with it — which silently blocked every other render.yaml
    # change (e.g. the version-info buildCommand) from applying. Re-add when a slot frees:
    # domains:
    #   - nw-tracker.crfrsr.io
    # The demo DB (real market history + the generated story) is built here, not at boot: Render
    # keeps the previous version serving while a build runs, but stops it before a new instance
    # boots (the persistent disk below rules out zero-downtime deploys), so a boot that fetched and
    # generated cost minutes of downtime. A market source that stays down fails the build, and the
    # old version keeps serving. The boot only generates when the DB is empty (local rehearsal).
    # BCENTRAL_EMAIL / BCENTRAL_PASSWORD are read at build time too.
    # version-info.mjs first: writes version.json (commit-stamped) at repo root while
    # .git is present, so the server can report the deployed commit at /api/health.
    buildCommand: node scripts/version-info.mjs --write version.json && npm install --include=dev -w nw-tracker-server -w nw-tracker-contracts -w nw-tracker-client --include-workspace-root && npm run build -w nw-tracker-client && rm -f server/data/nw-tracker.demo.db* && npm run demo:generate -w nw-tracker-server
    # The heap flag is on the start command, NOT an env var: a service env var applies to the
    # build too, and the client's Vite build aborted at 320 MB (deploy of e3e8a113, 2026-11-09).
    # V8 sizes its heap from the machine's memory — on the Starter (512 MB) a ~256 MB limit —
    # and the boot warm of the US-chapter demo died there («heap out of memory», a restart loop)
    # until the %-chains stopped retaining whole daily payloads (server/src/dailyPctSeries.ts;
    # ~200 MB after). 320 MB leaves the warm headroom and still fits the instance beside the
    # process's own ~130 MB; the warm's log line prints the heap it used.
    startCommand: NODE_OPTIONS=--max-old-space-size=320 npm run serve -w nw-tracker-server
    healthCheckPath: /api/health
    # Persistent disk for the visit analytics only. The synthetic demo DB
    # (NW_TRACKER_TEST_DB, a relative path → server/data/, ephemeral) still regenerates
    # every deploy so it always matches deployed code; DEMO_ANALYTICS_DB lives on this disk
    # so the visit log and the usage log survive regeneration. See server/src/usageDb.ts.
    # (The old demo-auth-logins.db from the login era stays on this disk, unread.)
    disk:
      name: nw-tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Node version intentionally not set here: Render falls back to .nvmrc,
      # so the version is pinned in one place (paired with package.json engines).
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "1"
      - key: SERVE_CLIENT_DIST
        value: "1"
      - key: NW_TRACKER_TEST_DB
        value: nw-tracker.demo.db
      - key: DEMO_ANALYTICS_DB
        value: /var/data/demo-analytics.db
      # Empty on purpose, and kept: this file once set --max-old-space-size here, which reached
      # the client build too (Vite aborted at 320 MB, deploy e3e8a113, 2026-11-09), and Render
      # keeps an env var a blueprint stops declaring — only a declared empty value clears it. The
      # server's heap flag is on the startCommand above.
      - key: NODE_OPTIONS
        value: ""
      # Streamed prices: at most one cache rebuild per 15 s on the small instance (the home
      # server writes every 5 s; server/src/yahooPriceStream.ts).
      - key: LIVE_QUOTES_FLUSH_GAP_MS
        value: "15000"
      # Cloudflare Web Analytics site token, read by the client build (Vite substitutes
      # %VITE_*% in client/index.html). Public by design — it names the site, not the
      # account — so it lives here rather than as a dashboard secret. Unset in any other
      # environment, which is what keeps local dev from beaconing.
      - key: VITE_CF_ANALYTICS_TOKEN
        value: 49ed5f2421b2413c819138c50dd359e7
      # HMAC salt for the visitor hash (IP+UA → opaque id, rotated daily). Generated once
      # by Render and never printed; rotating it just starts a new visitor-id namespace.
      - key: DEMO_ANALYTICS_SALT
        generateValue: true
      # Opening the demo once with ?owner=<this value> marks that browser as the author's: its
      # visits are kept but reported apart (server/src/demoAnalytics.ts). Generated by Render;
      # read it from the service's Environment tab.
      - key: DEMO_OWNER_CODE
        generateValue: true
      # Banco Central API (observed dollar, euro, UF, UTM, IPC) for the demo's real market data.
      # Entered by hand in the dashboard (secrets never live in this public file); the boot fails
      # without them.
      - key: BCENTRAL_EMAIL
        sync: false
      - key: BCENTRAL_PASSWORD
        sync: false
